<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plobby 포토부스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --green: #0E7A4E;
    --brand: #13BD7E;
    --blue: #1565C0;
    --text: #1C1F23;
    --text-sub: #6B7280;
    --track: #E5E7EB;
    --bg: #FFFFFF;
    --card: #F7F8F9;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .screen { display: none; height: 100vh; height: 100dvh; padding: 5vh 5vw; }
  .screen.active { display: grid; }

  /* ---------- 화면 1: 대시보드 ---------- */
  #dash { grid-template-rows: auto 1fr auto; gap: 3vh; }
  #dash header { display: flex; flex-direction: column; gap: 1.6vh; position: relative; }
  .collection-btn {
    position: absolute; top: 0; right: 0; width: 8vh; height: 8vh; border-radius: 2.2vh;
    display: grid; place-items: center; background: var(--card); color: var(--text);
  }
  .collection-btn svg { width: 4.2vh; height: 4.2vh; }
  .collection-btn:active { transform: scale(.95); }

  /* ---------- 컬렉션 ---------- */
  #collection { grid-template-rows: auto 1fr; gap: 3vh; }
  .collection-top { display: flex; align-items: center; gap: 1.6vw; }
  .collection-top h2 { font-size: 4.4vh; font-weight: 800; }
  .collection-top .total { font-size: 3vh; font-weight: 700; color: var(--green); }
  .collection-top .home-btn { margin-left: auto; }
  .collection-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(30vh, 40vw), 1fr)); gap: 1.6vh;
    overflow-y: auto; align-content: start; min-height: 0; padding-bottom: 2vh;
  }
  .collection-grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 1.6vh; background: var(--track); cursor: pointer; }
  .collection-grid .empty { grid-column: 1 / -1; height: 40vh; }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 10; }
  .viewer img { max-width: 90vw; max-height: 85vh; border-radius: 2vh; }
  .meta { display: flex; align-items: center; gap: 1vw; font-size: 2.2vh; color: var(--text-sub); }
  .chip { background: var(--card); padding: .5vh 1vw; border-radius: 1vh; font-weight: 600; }
  h1 { font-size: 5.5vh; font-weight: 700; }
  .count-row { display: flex; align-items: baseline; gap: 1vw; }
  .count { font-size: 9vh; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .target { font-size: 4vh; color: var(--text-sub); font-weight: 500; }
  .percent { margin-left: auto; font-size: 4vh; font-weight: 700; color: var(--green); }
  .track { height: 3vh; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

  #dash main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 3vw; min-height: 0; }
  .label { font-size: 2.4vh; font-weight: 700; color: var(--text-sub); margin-bottom: 1.5vh; }
  /* 기록마다 사진을 찍을 수 있다는 걸 보여주는 카메라 버튼 */
  .shoot-pill {
    position: absolute; top: 2vh; right: 2vh; display: flex; align-items: center; gap: .8vh;
    padding: 1.2vh 2vh; border-radius: 999px; background: var(--brand); color: #fff;
    font-size: 2.4vh; font-weight: 700; box-shadow: 0 .6vh 2vh rgba(0,0,0,.2);
  }
  .shoot-pill svg { width: 2.8vh; height: 2.8vh; }
  .shoot-icon {
    width: 6vh; height: 6vh; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--brand); color: #fff;
  }
  .shoot-icon svg { width: 3vh; height: 3vh; }

  .latest { display: flex; flex-direction: column; min-height: 0; }
  .latest-card { flex: 1; min-height: 0; position: relative; border-radius: 3vh; overflow: hidden; background: var(--card); }
  .latest-card.tappable { cursor: pointer; }
  .latest-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .latest-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8vh 2.5vw 3vh;
    background: linear-gradient(transparent, rgba(0,0,0,.55) 35%, rgba(0,0,0,.8)); color: #fff;
  }
  .latest-info .name { font-size: 4.5vh; font-weight: 700; }
  .latest-info .sub { font-size: 2.6vh; opacity: .9; margin-top: .6vh; }
  .latest-info .plus { font-size: 6vh; font-weight: 800; color: #7CE0A8; position: absolute; right: 2.5vw; bottom: 3vh; }
  .latest-card.new { animation: pop 1.4s ease; }
  @keyframes pop {
    0% { transform: scale(.94); box-shadow: 0 0 0 0 rgba(14,122,78,.6); }
    40% { transform: scale(1.02); box-shadow: 0 0 0 2vh rgba(14,122,78,.25); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(14,122,78,0); }
  }
  .tag { display: inline-block; padding: .4vh .8vw; border-radius: 1vh; font-weight: 700; font-size: .85em; vertical-align: middle; margin-right: .6vw; }
  .tag.tag.plogging { background: #E6F4EC; color: var(--green); }
  .tag.tag.plobbing { background: #E3F0FB; color: var(--blue); }
  .row .t .tag { font-size: 1.9vh; }
  .latest-info .tag { font-size: 2.4vh; margin-bottom: 1vh; }
  .empty { display: grid; place-items: center; height: 100%; font-size: 3vh; color: var(--text-sub); }

  .recent { display: flex; flex-direction: column; min-height: 0; }
  .recent-list { display: flex; flex-direction: column; gap: 1.6vh; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 1.4vw; padding: 1.2vh 1vw; border-radius: 2vh; background: var(--card); cursor: pointer; }
  .row:active, .latest-card.tappable:active { transform: scale(.98); }
  .row img, .row .ph { width: 9vh; height: 9vh; border-radius: 1.6vh; object-fit: cover; flex: none; background: var(--track); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 2.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t > span { display: block; font-size: 2.1vh; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .n { font-size: 3vh; font-weight: 800; color: var(--green); }

  #dash footer { display: flex; justify-content: space-between; font-size: 2vh; color: var(--text-sub); }
  .status::before { content: "●"; margin-right: .5vw; color: var(--green); }
  .status.off::before { color: #D14343; }

  /* ---------- 화면 2: 전체 화면 촬영 ---------- */
  #camera { padding: 0; background: #111; }
  .frame { position: relative; width: 100%; height: 100%; overflow: hidden; background: #111; }
  .frame video, .frame img.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* iPad Safari는 영상이 재생되기 전 재생 버튼을 잠깐 보여줘요. 재생이 시작될 때까지 영상을 숨기고 버튼도 감춰요. */
  .frame video { transform: scaleX(-1); opacity: 0; transition: opacity .2s; }
  .frame video.playing { opacity: 1; }
  .frame video::-webkit-media-controls,
  .frame video::-webkit-media-controls-start-playback-button,
  .frame video::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; }
  /* 프레임 안 정보와 쓰레기. 저장할 때와 같은 그리기 코드로 그려요. */
  .overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .frame .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #fff; font-size: 2.6vh; padding: 3vh; line-height: 1.5; white-space: pre-line; }
  .countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 24vh; font-weight: 800; color: #fff; text-shadow: 0 .6vh 3vh rgba(0,0,0,.4);
    pointer-events: none;
  }
  .countdown.tick { animation: tick 1s ease-out; }
  @keyframes tick { 0% { transform: scale(1.4); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: .85; } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 촬영 조작 버튼은 프레임 위에 떠 있고, 저장되는 사진에는 들어가지 않아요 */
  .camera-home {
    position: absolute; top: 4vh; left: 50%; transform: translateX(-50%);
    padding: 1.2vh 2.4vh; border-radius: 999px; font-size: 2.2vh; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.35);
  }
  .camera-actions {
    position: absolute; left: 50%; bottom: 20vh; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 1.4vh;
  }
  .camera-actions .buttons { display: flex; gap: 1.6vh; }
  /* 세로 화면은 폭이 좁아서, 상단 문구·하단 문구와 겹치지 않게 버튼을 안쪽으로 옮겨요 */
  @media (orientation: portrait) {
    .camera-home { top: 22vh; }
    .camera-actions { bottom: 33vh; }
  }
  .shutter {
    width: 11vh; height: 11vh; border-radius: 50%; background: var(--brand);
    box-shadow: 0 0 0 .7vh #fff, 0 0 0 1.1vh rgba(19,189,126,.6);
  }
  .shutter:disabled { opacity: .4; }
  .save-note { font-size: 1.9vh; color: #fff; text-shadow: 0 .2vh 1vh rgba(0,0,0,.5); }
  .pill { height: 7vh; padding: 0 3.4vh; border-radius: 999px; font-size: 2.6vh; font-weight: 700; }
  .pill.primary { background: var(--brand); color: #fff; }
  .pill.secondary { background: var(--card); color: var(--text); }
  .home-btn { font-size: 2.2vh; color: var(--text-sub); padding: 1.4vh 1vw; }

  /* ---------- 화면 3: 결과·공유 ---------- */
  #result { grid-template-rows: 1fr auto; gap: 3vh; }
  .result-photo { position: relative; min-height: 0; }
  .result-photo img {
    position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%;
    border-radius: 2.4vh; box-shadow: 0 1vh 4vh rgba(0,0,0,.15);
  }
  .result-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 3vw; }
  .share-error { font-size: 2vh; color: #D14343; text-align: right; margin-top: 1vh; min-height: 2.4vh; }
  .gallery { min-width: 0; flex: 1; }
  .gallery .label { margin-bottom: 1vh; }
  .thumbs { display: flex; gap: 1vh; overflow-x: auto; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumbs img { height: 9vh; width: auto; border-radius: 1.4vh; flex: none; background: var(--track); }
  .thumbs .none { font-size: 2vh; color: var(--text-sub); padding: 1vh 0; }
  .result-actions { display: flex; gap: 1.4vw; align-items: center; }
</style>
</head>

// ---------- 데이터 ----------

async function query(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

function storageURL(key) {
  return `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(IMAGE_BUCKET)}/${key.split("/").map(encodeURIComponent).join("/")}`;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function monthDay(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}

function timeAgo(iso) {
  const sec = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (sec < 60) return "방금";
  if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
  return monthDay(iso);
}

function todayText() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

async function fetchGoal() {
  const now = new Date().toISOString();
  const rows = await query(`goal_progress?select=goal_id,title,target_count,starts_at,ends_at,collected_count,achieved_at,achieved_count&starts_at=lte.${now}&ends_at=gt.${now}&order=starts_at.desc&limit=1`.replaceAll("+", "%2B"));
  return rows[0] ?? null;
}

async function fetchRecords(g) {
  const select = "id,title,record_type,created_at,record_photos(storage_key,photo_type,sort_order),users!records_user_id_fkey(profiles(nickname)),record_trash(quantity)";
  return query(`records?select=${select}&ended_at=gte.${g.starts_at}&ended_at=lt.${g.ends_at}&deleted_at=is.null&order=created_at.desc&limit=${RECENT_LIMIT}`.replaceAll("+", "%2B"));
}

function toRecord(row) {
  const photos = [...(row.record_photos ?? [])].sort((a, b) =>
    (a.photo_type === "activity" ? 0 : 1) - (b.photo_type === "activity" ? 0 : 1) || a.sort_order - b.sort_order);
  return {
    id: row.id,
    title: row.title,
    type: row.record_type,
    createdAt: row.created_at,
    nickname: row.users?.profiles?.nickname ?? "플로비",
    photo: photos[0] ? storageURL(photos[0].storage_key) : null,
    count: (row.record_trash ?? []).reduce((sum, t) => sum + t.quantity, 0)
  };
}

function collectedCount(g) {
  return g.achieved_at && g.achieved_count != null ? Math.max(g.collected_count, g.achieved_count) : g.collected_count;
}

function progressPercent(g) {
  return Math.min(100, (collectedCount(g) / g.target_count) * 100);
}

// ---------- 화면 1: 대시보드 ----------

function tagHTML(type) {
  return TYPE_NAMES[type] ? `<span class="tag ${type}">${TYPE_NAMES[type]}</span>` : "";
}

function renderGoal(g) {
  const days = Math.ceil((new Date(g.ends_at) - Date.now()) / 86400000);
  const lastDay = new Date(new Date(g.ends_at) - 1);
  const pct = progressPercent(g);

  $("title").textContent = g.title;
  $("dday").textContent = g.achieved_at ? "달성!" : days <= 1 ? "D-DAY" : `D-${days - 1}`;
  $("period").textContent = `${monthDay(g.starts_at)} ~ ${monthDay(lastDay)}`;
  $("target").textContent = `/ ${g.target_count.toLocaleString()}개`;
  $("percent").textContent = `${Math.floor(pct)}%`;
  $("bar").style.width = `${pct}%`;
  animateCount(collectedCount(g));
}

function animateCount(to) {
  const from = shownCount;
  if (from === to) { $("count").textContent = to.toLocaleString(); return; }
  const start = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - start) / 1200);
    const eased = 1 - Math.pow(1 - p, 3);
    $("count").textContent = Math.round(from + (to - from) * eased).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  shownCount = to;
}

function renderRecords() {
  const latest = records[0];
  const card = $("latest");

  if (!latest) {
    card.classList.remove("tappable");
    card.innerHTML = `<div class="empty">아직 올라온 기록이 없어요</div>`;
  } else {
    card.classList.add("tappable");
    card.innerHTML = `
      ${latest.photo ? `<img src="${latest.photo}" alt="">` : ""}
      <div class="shoot-pill">${CAMERA_ICON}사진 찍기</div>
      <div class="latest-info">
        ${tagHTML(latest.type)}
        <div class="name">${escapeHTML(latest.nickname)}</div>
        <div class="sub">${escapeHTML(latest.title)} · ${timeAgo(latest.createdAt)}</div>
        <div class="plus">+${latest.count}개</div>
      </div>`;
    if (lastTopID && lastTopID !== latest.id) {
      card.classList.remove("new");
      void card.offsetWidth;
      card.classList.add("new");
    }
    lastTopID = latest.id;
  }

  $("recent").innerHTML = records.slice(1).map((r, i) => `
    <div class="row" data-index="${i + 1}">
      ${r.photo ? `<img src="${r.photo}" alt="">` : `<div class="ph"></div>`}
      <div class="t"><b>${tagHTML(r.type)}${escapeHTML(r.nickname)}</b><span>${escapeHTML(r.title)} · ${timeAgo(r.createdAt)}</span></div>
      <div class="n">+${r.count}</div>
      <div class="shoot-icon" aria-label="이 기록으로 사진 찍기">${CAMERA_ICON}</div>
    </div>`).join("");
}

$("latest").addEventListener("click", () => records[0] && openCamera(records[0]));
$("recent").addEventListener("click", (event) => {
  const row = event.target.closest(".row");
  if (row) openCamera(records[Number(row.dataset.index)]);
});

async function refresh() {
  try {
    goal = (await fetchGoal()) ?? (goal && new Date(goal.ends_at) > new Date() ? goal : null);
    if (!goal) {
      $("title").textContent = "진행 중인 공통 목표가 없어요";
    } else {
      renderGoal(goal);
      records = (await fetchRecords(goal)).map(toRecord);
      renderRecords();
    }
    drawPreviewOverlay();
    $("status").className = "status";
    $("status").textContent = `실시간 연결 중 · ${new Date().toLocaleTimeString("ko-KR")}`;
  } catch (error) {
    $("status").className = "status off";
    $("status").textContent = "연결이 끊겼어요. 다시 시도하는 중이에요";
  }
}

// ---------- 화면 전환 ----------

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
}

function goHome() {
  stopCamera();
  isCounting = false;
  selected = null;
  show("dash");
}

document.querySelectorAll("[data-home]").forEach((b) => b.addEventListener("click", goHome));

// ---------- 프레임 안 정보와 쓰레기 그리기 ----------
// 화면 미리보기와 저장하는 사진이 같은 함수로 그려서, 보이는 그대로 저장돼요.

let assetsPromise = null;

function loadAssets() {
  assetsPromise ??= Promise.all([
    loadImage(ASSET_URLS.logo),
    Promise.all(TRASH.map((t) => loadImage(ASSET_URLS[t.name]))),
    document.fonts.load("800 40px Pretendard"),
    document.fonts.load("700 40px Pretendard"),
    document.fonts.load("600 40px Pretendard"),
    document.fonts.load("500 40px Pretendard")
  ]).then(([logo, trash]) => ({ logo, trash }))
    .catch((error) => { assetsPromise = null; throw error; });
  return assetsPromise;
}

function overlayInfo() {
  const record = selected ?? {};
  return {
    collected: goal ? collectedCount(goal) : 0,
    target: goal ? goal.target_count : 0,
    pct: goal ? progressPercent(goal) : 0,
    date: todayText(),
    type: record.type,
    label: record.type ? recordLabel(record) : "",
    count: record.count ?? 0
  };
}

const TAG_COLORS = {
  plogging: { bg: "#E6F4EC", fg: "#0E7A4E", plus: "#7CE0A8" },
  plobbing: { bg: "#E3F0FB", fg: "#1565C0", plus: "#9CCBFF" }
};

function drawOverlay(ctx, W, H, info, assets) {
  const U = H / 100;
  const P = 5 * U;
  const font = (weight, size) => `${weight} ${size}px Pretendard, -apple-system, sans-serif`;
  const shadow = (on) => {
    ctx.shadowColor = on ? "rgba(0,0,0,.35)" : "transparent";
    ctx.shadowBlur = on ? 1.2 * U : 0;
    ctx.shadowOffsetY = on ? 0.2 * U : 0;
  };

  ctx.save();

  // 글자가 잘 보이도록 위아래를 살짝 어둡게 해요
  let g = ctx.createLinearGradient(0, 0, 0, 30 * U);
  g.addColorStop(0, "rgba(0,0,0,.45)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 30 * U);
  g = ctx.createLinearGradient(0, H - 38 * U, 0, H);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = g;
  ctx.fillRect(0, H - 38 * U, W, 38 * U);

  // 하단에 깔린 쓰레기
  TRASH.forEach((t, i) => {
    const img = assets.trash[i];
    const h = t.h * U;
    const w = h * (img.width / img.height);
    ctx.save();
    ctx.translate(W * t.x / 100, H - t.bottom * U);
    ctx.rotate(t.r * Math.PI / 180);
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
  });

  ctx.textBaseline = "top";
  ctx.fillStyle = "#FFFFFF";

  // 좌측 상단: 문구, 현재/목표, 진행 바
  shadow(true);
  ctx.textAlign = "left";
  ctx.font = font(800, 4.4 * U);
  ctx.fillText("우리가 만드는 푸른 바다", P, P);
  const ratioY = P + 4.4 * U * 1.3 + 0.6 * U;
  const current = info.collected.toLocaleString();
  ctx.font = font(700, 3.2 * U);
  ctx.fillText(current, P, ratioY);
  const currentW = ctx.measureText(current).width;
  ctx.font = font(500, 3.2 * U);
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.fillText(`/${info.target.toLocaleString()}`, P + currentW + 0.3 * U, ratioY);
  shadow(false);
  const barY = ratioY + 3.2 * U * 1.3 + 0.8 * U, barW = 40 * U, barH = 1.4 * U;
  ctx.fillStyle = "rgba(255,255,255,.35)";
  roundRect(ctx, P, barY, barW, barH, barH / 2);
  ctx.fill();
  if (info.pct > 0) {
    ctx.fillStyle = "#13BD7E";
    roundRect(ctx, P, barY, Math.max(barH, barW * info.pct / 100), barH, barH / 2);
    ctx.fill();
  }

  // 우측 상단: 날짜, 로고
  shadow(true);
  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "right";
  ctx.font = font(600, 3 * U);
  ctx.fillText(info.date, W - P, P);
  const logoH = 5.4 * U, logoW = logoH * (assets.logo.width / assets.logo.height);
  ctx.drawImage(assets.logo, W - P - logoW, P + 3 * U * 1.3 + 1 * U, logoW, logoH);

  // 좌측 하단: 태그, 기록 문구 / 우측 하단: +n개 (같은 줄)
  if (info.label) {
    const colors = TAG_COLORS[info.type] ?? TAG_COLORS.plogging;
    const lineBottom = H - 22 * U;
    ctx.textBaseline = "bottom";
    ctx.textAlign = "left";
    ctx.font = font(700, 4.6 * U);
    ctx.fillText(info.label, P, lineBottom);
    ctx.textAlign = "right";
    ctx.font = font(800, 4.6 * U);
    ctx.fillStyle = colors.plus;
    ctx.fillText(`+${info.count.toLocaleString()}개`, W - P, lineBottom);

    shadow(false);
    const tagText = TYPE_NAMES[info.type] ?? "";
    ctx.font = font(700, 3 * U);
    const tagW = ctx.measureText(tagText).width + 3.4 * U, tagH = 5 * U;
    const tagY = lineBottom - 4.6 * U * 1.2 - 1.2 * U - tagH;
    ctx.fillStyle = colors.bg;
    roundRect(ctx, P, tagY, tagW, tagH, 1 * U);
    ctx.fill();
    ctx.fillStyle = colors.fg;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(tagText, P + tagW / 2, tagY + tagH / 2 + 0.1 * U);
  }

  ctx.restore();
}

async function drawPreviewOverlay() {
  const canvas = $("overlay");
  if (!$("camera").classList.contains("active")) return;
  const assets = await loadAssets();
  const rect = $("frame").getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawOverlay(ctx, canvas.width, canvas.height, overlayInfo(), assets);
}

new ResizeObserver(() => drawPreviewOverlay()).observe($("frame"));

// ---------- 화면 2: 사진 촬영 ----------

function recordLabel(record) {
  return `영일대${TYPE_NAMES[record.type] ?? ""} 기록`;
}

async function openCamera(record) {
  selected = record;
  show("camera");
  drawPreviewOverlay();
  await startPreview();
}

async function startPreview() {
  clearPhoto();
  $("shot").hidden = true;
  $("overlay").hidden = false;
  $("video").hidden = false;
  if (stream) $("video").play().catch(() => {});
  $("countdown").hidden = true;
  setCameraActions("ready");

  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } },
        audio: false
      });
      $("video").srcObject = stream;
      $("video").play().catch(() => {});
      $("cameraMsg").hidden = true;
    } catch (error) {
      $("cameraMsg").hidden = false;
      $("cameraMsg").textContent = "카메라를 켤 수 없어요.\n브라우저 설정에서 카메라 권한을 허용해 주세요.";
      setCameraActions("none");
    }
  }
}

$("video").addEventListener("playing", () => $("video").classList.add("playing"));

function stopCamera() {
  $("video").classList.remove("playing");
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
  $("video").srcObject = null;
}

function setCameraActions(mode) {
  const box = $("cameraActions");
  if (mode === "ready") {
    box.innerHTML = `<button class="shutter" id="shutterBtn" aria-label="촬영"></button>`;
    $("shutterBtn").addEventListener("click", startCountdown);
  } else if (mode === "taken") {
    box.innerHTML = `
      <button class="pill secondary" id="retakeBtn">다시 찍기</button>
      <button class="pill primary" id="nextBtn">다음</button>`;
    $("retakeBtn").addEventListener("click", startPreview);
    $("nextBtn").addEventListener("click", openResult, { once: true });
  } else {
    box.innerHTML = "";
  }
  $("saveNote").textContent = mode === "taken" ? "\"다음\"을 누르면 사진이 부스 컬렉션에 저장돼요" : "";
}

function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function startCountdown() {
  if (isCounting || !stream) return;
  isCounting = true;
  $("shutterBtn").disabled = true;

  const countdown = $("countdown");
  countdown.hidden = false;
  for (let n = COUNTDOWN_SECONDS; n > 0; n--) {
    if (!isCounting) return;
    countdown.textContent = n;
    countdown.classList.remove("tick");
    void countdown.offsetWidth;
    countdown.classList.add("tick");
    await wait(1000);
  }
  countdown.hidden = true;
  if (!isCounting) return;
  isCounting = false;
  await capture();
}

/** 화면에 보이는 프레임 그대로(카메라 + 정보 + 쓰레기) 사진을 만들어요. */
async function capture() {
  const video = $("video");
  const rect = $("frame").getBoundingClientRect();
  const ratio = rect.width / rect.height;
  const W = ratio >= 1 ? PHOTO_LONG_EDGE : Math.round(PHOTO_LONG_EDGE * ratio);
  const H = ratio >= 1 ? Math.round(PHOTO_LONG_EDGE / ratio) : PHOTO_LONG_EDGE;

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  // 프레임 비율로 가운데를 잘라내고(object-fit: cover와 같아요), 미리보기처럼 좌우를 뒤집어요
  const vw = video.videoWidth, vh = video.videoHeight;
  let sw = vw, sh = vw / ratio;
  if (sh > vh) { sh = vh; sw = vh * ratio; }
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
  ctx.restore();
  try {
    drawOverlay(ctx, W, H, overlayInfo(), await loadAssets());
  } catch (error) {
    // 그림을 불러오지 못해도 사진은 남겨요.
  }

  const flash = $("flash");
  flash.classList.remove("on");
  void flash.offsetWidth;
  flash.classList.add("on");

  try {
    framedBlob = await new Promise((resolve, reject) =>
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("toBlob")), "image/jpeg", 0.9));
  } catch (error) {
    framedBlob = null;
    $("cameraMsg").hidden = false;
    $("cameraMsg").textContent = "사진을 만들지 못했어요.\n다시 찍어 주세요.";
    setCameraActions("ready");
    setTimeout(() => { $("cameraMsg").hidden = true; }, 2500);
    return;
  }
  framedURL = URL.createObjectURL(framedBlob);
  $("shot").src = framedURL;
  $("shot").hidden = false;
  $("overlay").hidden = true;
  $("video").hidden = true;
  setCameraActions("taken");
}

function clearPhoto() {
  if (framedURL) URL.revokeObjectURL(framedURL);
  framedURL = null;
  framedBlob = null;
}

// ---------- 화면 3: 결과·공유 ----------

async function openResult() {
  if (!framedBlob) return;
  stopCamera();
  $("resultShot").src = framedURL;
  show("result");

  // "다음"을 누르면 찍은 사진을 이 기기의 컬렉션에 저장해요.
  const others = await loadGallery();
  await savePhoto(framedBlob);
  renderGallery(others);
  shareFile = new File([framedBlob], `plobby-${Date.now()}.jpg`, { type: "image/jpeg" });
  $("shareError").textContent = "";
}

// ---------- 컬렉션 ----------

async function openCollection() {
  const grid = $("collectionGrid");
  grid.querySelectorAll("img").forEach((img) => URL.revokeObjectURL(img.src));
  show("collection");
  const photos = await loadGallery(Infinity);
  $("collectionTotal").textContent = `${photos.length.toLocaleString()}장`;
  grid.innerHTML = photos.length
    ? photos.map((p) => `<img src="${URL.createObjectURL(p.blob)}" alt="" loading="lazy" decoding="async">`).join("")
    : `<div class="empty">아직 찍은 사진이 없어요</div>`;
}

$("collectionBtn").addEventListener("click", openCollection);
$("collectionGrid").addEventListener("click", (event) => {
  if (event.target.tagName !== "IMG") return;
  $("viewerImg").src = event.target.src;
  $("viewer").hidden = false;
});
$("viewer").addEventListener("click", () => { $("viewer").hidden = true; });

function renderGallery(photos) {
  const thumbs = $("thumbs");
  thumbs.querySelectorAll("img").forEach((img) => URL.revokeObjectURL(img.src));
  thumbs.innerHTML = photos.length
    ? photos.map((p) => `<img src="${URL.createObjectURL(p.blob)}" alt="">`).join("")
    : `<div class="none">첫 번째 사진이에요!</div>`;
}

$("shareBtn").addEventListener("click", () => {
  if (!shareFile) return;
  $("shareError").textContent = "";

  if (navigator.canShare?.({ files: [shareFile] })) {
    navigator.share({ files: [shareFile] }).catch((error) => {
      // 공유 시트를 닫으면 AbortError가 나요. 그때는 따로 알리지 않아요.
      if (error.name !== "AbortError") $("shareError").textContent = "공유하지 못했어요. 다시 눌러 주세요.";
    });
  } else {
    // 파일 공유를 지원하지 않는 브라우저에서는 이미지를 내려받아요.
    const link = document.createElement("a");
    link.href = URL.createObjectURL(shareFile);
    link.download = shareFile.name;
    link.click();
  }
});

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 촬영 기기에 사진 모아두기 (IndexedDB) ----------

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("plobby-booth", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function savePhoto(blob) {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").add({ blob, createdAt: Date.now() });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (error) {
    // 저장하지 못해도 촬영·공유는 그대로 할 수 있어요.
  }
}

async function loadGallery(limit = GALLERY_LIMIT) {
  try {
    const db = await openDB();
    const all = await new Promise((resolve, reject) => {
      const request = db.transaction("photos").objectStore("photos").getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return all.sort((a, b) => b.createdAt - a.createdAt).slice(0, limit);
  } catch (error) {
    return [];
  }
}

// 2026-11-18 이전에 찍은 사진은 기기마다 한 번만 지워요. 이후에 찍은 사진은 그대로 남아요.
const PHOTO_RESET_KEY = "plobby-booth-reset-2026-11-18";
try {
  if (!localStorage.getItem(PHOTO_RESET_KEY)) {
    indexedDB.deleteDatabase("plobby-booth");
    localStorage.setItem(PHOTO_RESET_KEY, "done");
  }
} catch (error) {
  // 저장소를 쓸 수 없으면 지울 사진도 없어요.
}

refresh();
setInterval(refresh, POLL_MS);
</script>
