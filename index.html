<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plobby 포토부스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --green: #0E7A4E;
    --brand: #13BD7E;
    --blue: #1565C0;
    --text: #1C1F23;
    --text-sub: #6B7280;
    --track: #E5E7EB;
    --bg: #FFFFFF;
    --card: #F7F8F9;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .screen { display: none; height: 100vh; height: 100dvh; padding: 5vh 5vw; }
  .screen.active { display: grid; }

  /* ---------- 화면 1: 대시보드 ---------- */
  #dash { grid-template-rows: auto 1fr auto; gap: 3vh; }
  #dash header { display: flex; flex-direction: column; gap: 1.6vh; position: relative; }
  .collection-btn {
    position: absolute; top: 0; right: 0; width: 8vh; height: 8vh; border-radius: 50%;
    display: grid; place-items: center; background: var(--card); color: var(--text);
  }
  .collection-btn svg { width: 4.6vh; height: 4.6vh; }
  .collection-btn:active { transform: scale(.95); }

  /* ---------- 컬렉션 ---------- */
  #collection { grid-template-rows: auto 1fr; gap: 3vh; }
  .collection-top { display: flex; align-items: center; gap: 1.6vw; }
  .collection-top h2 { font-size: 4.4vh; font-weight: 800; }
  .collection-top .total { font-size: 3vh; font-weight: 700; color: var(--green); }
  .collection-top .home-btn { margin-left: auto; }
  .collection-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(30vh, 40vw), 1fr)); gap: 1.6vh;
    overflow-y: auto; align-content: start; min-height: 0; padding-bottom: 2vh;
  }
  .collection-grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 1.6vh; background: var(--track); cursor: pointer; }
  .collection-grid .empty { grid-column: 1 / -1; height: 40vh; }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 10; }
  .viewer img { max-width: 90vw; max-height: 85vh; border-radius: 2vh; }
  .meta { display: flex; align-items: center; gap: 1vw; font-size: 2.2vh; color: var(--text-sub); }
  .chip { background: var(--card); padding: .5vh 1vw; border-radius: 1vh; font-weight: 600; }
  h1 { font-size: 5.5vh; font-weight: 700; }
  .count-row { display: flex; align-items: baseline; gap: 1vw; }
  .count { font-size: 9vh; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .target { font-size: 4vh; color: var(--text-sub); font-weight: 500; }
  .percent { margin-left: auto; font-size: 4vh; font-weight: 700; color: var(--green); }
  .track { height: 3vh; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

  #dash main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 3vw; min-height: 0; }
  .label { font-size: 2.4vh; font-weight: 700; color: var(--text-sub); margin-bottom: 1.5vh; }
  .hint { font-weight: 500; color: var(--brand); margin-left: .6vw; }

  .latest { display: flex; flex-direction: column; min-height: 0; }
  .latest-card { flex: 1; min-height: 0; position: relative; border-radius: 3vh; overflow: hidden; background: var(--card); }
  .latest-card.tappable { cursor: pointer; }
  .latest-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .latest-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8vh 2.5vw 3vh;
    background: linear-gradient(transparent, rgba(0,0,0,.55) 35%, rgba(0,0,0,.8)); color: #fff;
  }
  .latest-info .name { font-size: 4.5vh; font-weight: 700; }
  .latest-info .sub { font-size: 2.6vh; opacity: .9; margin-top: .6vh; }
  .latest-info .plus { font-size: 6vh; font-weight: 800; color: #7CE0A8; position: absolute; right: 2.5vw; bottom: 3vh; }
  .latest-card.new { animation: pop 1.4s ease; }
  @keyframes pop {
    0% { transform: scale(.94); box-shadow: 0 0 0 0 rgba(14,122,78,.6); }
    40% { transform: scale(1.02); box-shadow: 0 0 0 2vh rgba(14,122,78,.25); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(14,122,78,0); }
  }
  .tag { display: inline-block; padding: .4vh .8vw; border-radius: 1vh; font-weight: 700; font-size: .85em; vertical-align: middle; margin-right: .6vw; }
  .tag.tag.plogging { background: #E6F4EC; color: var(--green); }
  .tag.tag.plobbing { background: #E3F0FB; color: var(--blue); }
  .row .t .tag { font-size: 1.9vh; }
  .latest-info .tag { font-size: 2.4vh; margin-bottom: 1vh; }
  .empty { display: grid; place-items: center; height: 100%; font-size: 3vh; color: var(--text-sub); }

  .recent { display: flex; flex-direction: column; min-height: 0; }
  .recent-list { display: flex; flex-direction: column; gap: 1.6vh; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 1.4vw; padding: 1.2vh 1vw; border-radius: 2vh; background: var(--card); cursor: pointer; }
  .row:active, .latest-card.tappable:active { transform: scale(.98); }
  .row img, .row .ph { width: 9vh; height: 9vh; border-radius: 1.6vh; object-fit: cover; flex: none; background: var(--track); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 2.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { font-size: 2.1vh; color: var(--text-sub); }
  .row .n { font-size: 3vh; font-weight: 800; color: var(--green); }

  #dash footer { display: flex; justify-content: space-between; font-size: 2vh; color: var(--text-sub); }
  .status::before { content: "●"; margin-right: .5vw; color: var(--green); }
  .status.off::before { color: #D14343; }

  /* ---------- 화면 2·3: 포토부스 공통 ---------- */
  .booth { grid-template-rows: auto 1fr auto; gap: 2.5vh; }
  .booth-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4vw; }
  .booth-goal { flex: 1; max-width: 46vh; display: flex; flex-direction: column; gap: 1vh; }
  .booth-goal .slogan { font-size: 3.4vh; font-weight: 800; }
  .booth-goal .ratio { font-size: 2.6vh; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
  .booth-goal .ratio span { color: var(--text-sub); font-weight: 500; }
  .booth-goal .track { height: 1.4vh; }
  .booth-brand { display: flex; flex-direction: column; align-items: flex-end; gap: 1.2vh; }
  .booth-brand .date { font-size: 2.4vh; font-weight: 600; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .booth-brand img { height: 4vh; }

  .booth-middle { display: flex; flex-direction: column; align-items: center; min-height: 0; gap: 2.5vh; }
  .stage { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; container-type: size; }
  .frame {
    position: relative; width: min(100cqw, 100cqh * 4 / 3); aspect-ratio: 4 / 3;
    border-radius: 3vh; overflow: hidden; background: #111;
  }
  .frame video, .frame img.shot { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame video { transform: scaleX(-1); }
  .frame .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #fff; font-size: 2.4vh; padding: 3vh; line-height: 1.5; white-space: pre-line; }
  .countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 22vh; font-weight: 800; color: #fff; text-shadow: 0 .6vh 3vh rgba(0,0,0,.4);
    pointer-events: none;
  }
  .countdown.tick { animation: tick 1s ease-out; }
  @keyframes tick { 0% { transform: scale(1.4); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: .85; } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  .controls { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 11vh; }
  .controls .center { display: flex; gap: 1.6vw; justify-content: center; }
  .home-btn { justify-self: start; font-size: 2.2vh; color: var(--text-sub); padding: 1.4vh 1vw; }
  .shutter {
    width: 11vh; height: 11vh; border-radius: 50%; background: var(--brand);
    box-shadow: 0 0 0 .7vh #fff, 0 0 0 1.1vh var(--brand);
  }
  .shutter:disabled { opacity: .4; }
  .save-note { font-size: 1.9vh; color: var(--text-sub); text-align: center; margin-top: -1vh; min-height: 2.4vh; }
  .pill { height: 7vh; padding: 0 3.4vh; border-radius: 999px; font-size: 2.6vh; font-weight: 700; }
  .pill.primary { background: var(--brand); color: #fff; }
  .pill.secondary { background: var(--card); color: var(--text); }

  .booth-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 3vw; }
  .booth-bottom .tag { font-size: 2.2vh; padding: .6vh 1.2vh; margin: 0 0 1vh; }
  .booth-bottom .record { font-size: 3vh; font-weight: 700; }
  .booth-bottom .plus { font-size: 3vh; font-weight: 800; color: var(--green); }
  .booth-bottom .plus.plobbing { color: var(--blue); }

  /* 화면 3 */
  .trash-layer { position: absolute; inset: 0; pointer-events: none; }
  .trash-layer img { position: absolute; transform-origin: center bottom; }
  .share-error { font-size: 2vh; color: #D14343; text-align: right; margin-top: 1vh; min-height: 2.4vh; }
  .gallery { min-width: 0; flex: 1; }
  .gallery .label { margin-bottom: 1vh; }
  .thumbs { display: flex; gap: 1vh; overflow-x: auto; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumbs img { width: 12vh; height: 9vh; object-fit: cover; border-radius: 1.4vh; flex: none; background: var(--track); }
  .thumbs .none { font-size: 2vh; color: var(--text-sub); padding: 1vh 0; }
  .result-actions { display: flex; gap: 1.4vw; align-items: center; }
</style>
</head>
<body>
  <!-- 화면 1: 대시보드 -->
  <section class="screen active" id="dash">
    <header>
      <button class="collection-btn" id="collectionBtn" aria-label="부스 컬렉션 보기">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
          <circle cx="24" cy="24" r="21"/>
          <rect x="12" y="13" width="11" height="12" rx="3"/>
          <rect x="26" y="12" width="10" height="10" rx="3"/>
          <rect x="15" y="28" width="10" height="9" rx="3"/>
          <rect x="28" y="26" width="8" height="8" rx="2.5"/>
        </svg>
      </button>
      <div class="meta"><span class="chip" id="dday">-</span><span id="period"></span></div>
      <h1 id="title">공통 목표를 불러오는 중이에요</h1>
      <div class="count-row">
        <span class="count" id="count">0</span>
        <span class="target" id="target"></span>
        <span class="percent" id="percent"></span>
      </div>
      <div class="track"><div class="bar" id="bar"></div></div>
    </header>

    <main>
      <section class="latest">
        <div class="label">방금 올라온 기록<span class="hint">탭해서 사진 찍기</span></div>
        <div class="latest-card" id="latest"><div class="empty">아직 올라온 기록이 없어요</div></div>
      </section>
      <section class="recent">
        <div class="label">최근 기록</div>
        <div class="recent-list" id="recent"></div>
      </section>
    </main>

    <footer>
      <span>Plobby · 함께 줍는 바다</span>
      <span class="status" id="status">실시간 연결 중</span>
    </footer>
  </section>

  <!-- 컬렉션: 이 기기에서 찍은 모든 사진 -->
  <section class="screen" id="collection">
    <div class="collection-top">
      <h2>부스 컬렉션</h2>
      <span class="total" id="collectionTotal"></span>
      <button class="home-btn" data-home>← 처음으로</button>
    </div>
    <div class="collection-grid" id="collectionGrid"></div>
  </section>
  <div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""></div>

  <!-- 화면 2: 사진 촬영 -->
  <section class="screen booth" id="camera">
    <div class="booth-top" data-booth-top></div>
    <div class="booth-middle">
      <div class="stage">
        <div class="frame">
          <video id="video" autoplay playsinline muted></video>
          <img class="shot" id="shot" alt="" hidden>
          <div class="msg" id="cameraMsg" hidden></div>
          <div class="countdown" id="countdown" hidden></div>
          <div class="flash" id="flash"></div>
        </div>
      </div>
      <div class="controls">
        <button class="home-btn" data-home>← 처음으로</button>
        <div class="center" id="cameraActions"></div>
        <span></span>
      </div>
      <div class="save-note" id="saveNote"></div>
    </div>
    <div class="booth-bottom">
      <div>
        <div><span class="tag" id="cameraTag"></span></div>
        <div class="record" id="cameraRecord"></div>
      </div>
      <div class="plus" id="cameraPlus"></div>
    </div>
  </section>

  <!-- 화면 3: 결과·공유 -->
  <section class="screen booth" id="result">
    <div class="booth-top" data-booth-top></div>
    <div class="booth-middle">
      <div class="stage">
        <div class="frame">
          <img class="shot" id="resultShot" alt="">
          <div class="trash-layer" id="trashLayer"></div>
        </div>
      </div>
    </div>
    <div class="booth-bottom">
      <div class="gallery">
        <div class="label">함께한 사람들</div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div>
        <div class="result-actions">
          <button class="pill secondary" data-home>처음으로</button>
          <button class="pill primary" id="shareBtn">공유하기</button>
        </div>
        <div class="share-error" id="shareError"></div>
      </div>
    </div>
  </section>

<script>
const SUPABASE_URL = "https://mgruxkyludsbuemgjlkd.supabase.co";
const SUPABASE_KEY = "sb_publishable_i2KRZCQ09UuKSZECmr49Fw_plQFp-vu";
const IMAGE_BUCKET = "Plobby Image Bucket";
const POLL_MS = 5000;
const RECENT_LIMIT = 6;
const COUNTDOWN_SECONDS = 5;
const PHOTO_WIDTH = 1440;
const PHOTO_HEIGHT = 1080;
// 사진 프레임 안 하단에 깔리는 쓰레기. x: 가운데 위치(프레임 너비 %), bottom: 아래 끝(프레임 높이 %, 음수면 프레임 밖으로 잠겨요),
// h: 높이(프레임 높이 %), r: 기울기(도)
const TRASH = [
  { name: "buoy_horizontal_orange", x: 7, bottom: -3, h: 14, r: -8 },
  { name: "bottle_blue", x: 17, bottom: -7, h: 28, r: 20 },
  { name: "cup_red", x: 27, bottom: -2, h: 15, r: -12 },
  { name: "plastic_bag_sky_blue", x: 37, bottom: -4, h: 17, r: 6 },
  { name: "straw_striped", x: 47, bottom: -4, h: 18, r: -18 },
  { name: "soda_can_mint", x: 57, bottom: -3, h: 16, r: 14 },
  { name: "tin_can_red", x: 67, bottom: -2, h: 12, r: -6 },
  { name: "glass_bottle_green", x: 78, bottom: -9, h: 30, r: -22 },
  { name: "bottle_crumpled_yellow", x: 88, bottom: -3, h: 16, r: 10 },
  { name: "paper_cup_white", x: 96, bottom: -2, h: 14, r: -10 }
];
const GALLERY_LIMIT = 30;
const TYPE_NAMES = { plogging: "플로깅", plobbing: "플로빙" };

let goal = null;
let shownCount = 0;
let lastTopID = null;
let records = [];
let selected = null;
let stream = null;
let photoBlob = null;
let photoURL = null;
let isCounting = false;
let shareFile = null;
let framedBlob = null;

const $ = (id) => document.getElementById(id);

// ---------- 데이터 ----------

async function query(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

function storageURL(key) {
  return `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(IMAGE_BUCKET)}/${key.split("/").map(encodeURIComponent).join("/")}`;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function monthDay(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}

function timeAgo(iso) {
  const sec = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (sec < 60) return "방금";
  if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
  return monthDay(iso);
}

function todayText() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

async function fetchGoal() {
  const now = new Date().toISOString();
  const rows = await query(`goal_progress?select=goal_id,title,target_count,starts_at,ends_at,collected_count,achieved_at,achieved_count&starts_at=lte.${now}&ends_at=gt.${now}&order=starts_at.desc&limit=1`.replaceAll("+", "%2B"));
  return rows[0] ?? null;
}

async function fetchRecords(g) {
  const select = "id,title,record_type,created_at,record_photos(storage_key,photo_type,sort_order),users!records_user_id_fkey(profiles(nickname)),record_trash(quantity)";
  return query(`records?select=${select}&ended_at=gte.${g.starts_at}&ended_at=lt.${g.ends_at}&deleted_at=is.null&order=created_at.desc&limit=${RECENT_LIMIT}`.replaceAll("+", "%2B"));
}

function toRecord(row) {
  const photos = [...(row.record_photos ?? [])].sort((a, b) =>
    (a.photo_type === "activity" ? 0 : 1) - (b.photo_type === "activity" ? 0 : 1) || a.sort_order - b.sort_order);
  return {
    id: row.id,
    title: row.title,
    type: row.record_type,
    createdAt: row.created_at,
    nickname: row.users?.profiles?.nickname ?? "플로비",
    photo: photos[0] ? storageURL(photos[0].storage_key) : null,
    count: (row.record_trash ?? []).reduce((sum, t) => sum + t.quantity, 0)
  };
}

function collectedCount(g) {
  return g.achieved_at && g.achieved_count != null ? Math.max(g.collected_count, g.achieved_count) : g.collected_count;
}

function progressPercent(g) {
  return Math.min(100, (collectedCount(g) / g.target_count) * 100);
}

// ---------- 화면 1: 대시보드 ----------

function tagHTML(type) {
  return TYPE_NAMES[type] ? `<span class="tag ${type}">${TYPE_NAMES[type]}</span>` : "";
}

function renderGoal(g) {
  const days = Math.ceil((new Date(g.ends_at) - Date.now()) / 86400000);
  const lastDay = new Date(new Date(g.ends_at) - 1);
  const pct = progressPercent(g);

  $("title").textContent = g.title;
  $("dday").textContent = g.achieved_at ? "달성!" : days <= 1 ? "D-DAY" : `D-${days - 1}`;
  $("period").textContent = `${monthDay(g.starts_at)} ~ ${monthDay(lastDay)}`;
  $("target").textContent = `/ ${g.target_count.toLocaleString()}개`;
  $("percent").textContent = `${Math.floor(pct)}%`;
  $("bar").style.width = `${pct}%`;
  animateCount(collectedCount(g));
}

function animateCount(to) {
  const from = shownCount;
  if (from === to) { $("count").textContent = to.toLocaleString(); return; }
  const start = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - start) / 1200);
    const eased = 1 - Math.pow(1 - p, 3);
    $("count").textContent = Math.round(from + (to - from) * eased).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  shownCount = to;
}

function renderRecords() {
  const latest = records[0];
  const card = $("latest");

  if (!latest) {
    card.classList.remove("tappable");
    card.innerHTML = `<div class="empty">아직 올라온 기록이 없어요</div>`;
  } else {
    card.classList.add("tappable");
    card.innerHTML = `
      ${latest.photo ? `<img src="${latest.photo}" alt="">` : ""}
      <div class="latest-info">
        ${tagHTML(latest.type)}
        <div class="name">${escapeHTML(latest.nickname)}</div>
        <div class="sub">${escapeHTML(latest.title)} · ${timeAgo(latest.createdAt)}</div>
        <div class="plus">+${latest.count}개</div>
      </div>`;
    if (lastTopID && lastTopID !== latest.id) {
      card.classList.remove("new");
      void card.offsetWidth;
      card.classList.add("new");
    }
    lastTopID = latest.id;
  }

  $("recent").innerHTML = records.slice(1).map((r, i) => `
    <div class="row" data-index="${i + 1}">
      ${r.photo ? `<img src="${r.photo}" alt="">` : `<div class="ph"></div>`}
      <div class="t"><b>${tagHTML(r.type)}${escapeHTML(r.nickname)}</b><span>${escapeHTML(r.title)} · ${timeAgo(r.createdAt)}</span></div>
      <div class="n">+${r.count}</div>
    </div>`).join("");
}

$("latest").addEventListener("click", () => records[0] && openCamera(records[0]));
$("recent").addEventListener("click", (event) => {
  const row = event.target.closest(".row");
  if (row) openCamera(records[Number(row.dataset.index)]);
});

async function refresh() {
  try {
    goal = (await fetchGoal()) ?? (goal && new Date(goal.ends_at) > new Date() ? goal : null);
    if (!goal) {
      $("title").textContent = "진행 중인 공통 목표가 없어요";
    } else {
      renderGoal(goal);
      records = (await fetchRecords(goal)).map(toRecord);
      renderRecords();
    }
    renderBoothTop();
    $("status").className = "status";
    $("status").textContent = `실시간 연결 중 · ${new Date().toLocaleTimeString("ko-KR")}`;
  } catch (error) {
    $("status").className = "status off";
    $("status").textContent = "연결이 끊겼어요. 다시 시도하는 중이에요";
  }
}

// ---------- 화면 전환 ----------

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
}

function goHome() {
  stopCamera();
  isCounting = false;
  selected = null;
  show("dash");
}

document.querySelectorAll("[data-home]").forEach((b) => b.addEventListener("click", goHome));

// ---------- 화면 2·3 공통 상단 ----------

function renderBoothTop() {
  const collected = goal ? collectedCount(goal) : 0;
  const target = goal ? goal.target_count : 0;
  const pct = goal ? progressPercent(goal) : 0;
  const html = `
    <div class="booth-goal">
      <div class="slogan">우리가 만드는 푸른 바다</div>
      <div class="ratio">${collected.toLocaleString()}<span>/${target.toLocaleString()}</span></div>
      <div class="track"><div class="bar" style="width:${pct}%"></div></div>
    </div>
    <div class="booth-brand">
      <div class="date">${todayText()}</div>
      <img src="logo.svg" alt="Plobby">
    </div>`;
  document.querySelectorAll("[data-booth-top]").forEach((el) => { el.innerHTML = html; });
}

// ---------- 화면 2: 사진 촬영 ----------

function recordLabel(record) {
  return `영일대${TYPE_NAMES[record.type] ?? ""} 기록`;
}

async function openCamera(record) {
  selected = record;
  $("cameraTag").className = `tag ${record.type}`;
  $("cameraTag").textContent = TYPE_NAMES[record.type] ?? "";
  $("cameraRecord").textContent = recordLabel(record);
  $("cameraPlus").className = `plus ${record.type}`;
  $("cameraPlus").textContent = `+${record.count}개`;
  renderBoothTop();
  show("camera");
  await startPreview();
}

async function startPreview() {
  clearPhoto();
  $("shot").hidden = true;
  $("video").hidden = false;
  $("countdown").hidden = true;
  setCameraActions("ready");

  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } },
        audio: false
      });
      $("video").srcObject = stream;
      $("cameraMsg").hidden = true;
    } catch (error) {
      $("cameraMsg").hidden = false;
      $("cameraMsg").textContent = "카메라를 켤 수 없어요.\n브라우저 설정에서 카메라 권한을 허용해 주세요.";
      setCameraActions("none");
    }
  }
}

function stopCamera() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
  $("video").srcObject = null;
}

function setCameraActions(mode) {
  const box = $("cameraActions");
  if (mode === "ready") {
    box.innerHTML = `<button class="shutter" id="shutterBtn" aria-label="촬영"></button>`;
    $("shutterBtn").addEventListener("click", startCountdown);
  } else if (mode === "taken") {
    box.innerHTML = `
      <button class="pill secondary" id="retakeBtn">다시 찍기</button>
      <button class="pill primary" id="nextBtn">다음</button>`;
    $("retakeBtn").addEventListener("click", startPreview);
    $("nextBtn").addEventListener("click", openResult, { once: true });
  } else {
    box.innerHTML = "";
  }
  $("saveNote").textContent = mode === "taken" ? "\"다음\"을 누르면 사진이 부스 컬렉션에 저장돼요" : "";
}

function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function startCountdown() {
  if (isCounting || !stream) return;
  isCounting = true;
  $("shutterBtn").disabled = true;

  const countdown = $("countdown");
  countdown.hidden = false;
  for (let n = COUNTDOWN_SECONDS; n > 0; n--) {
    if (!isCounting) return;
    countdown.textContent = n;
    countdown.classList.remove("tick");
    void countdown.offsetWidth;
    countdown.classList.add("tick");
    await wait(1000);
  }
  countdown.hidden = true;
  if (!isCounting) return;
  isCounting = false;
  await capture();
}

async function capture() {
  const video = $("video");
  const canvas = document.createElement("canvas");
  canvas.width = PHOTO_WIDTH;
  canvas.height = PHOTO_HEIGHT;
  const ctx = canvas.getContext("2d");

  // 프레임(4:3) 비율로 가운데를 잘라내고, 미리보기처럼 좌우를 뒤집어요
  const vw = video.videoWidth, vh = video.videoHeight;
  const ratio = PHOTO_WIDTH / PHOTO_HEIGHT;
  let sw = vw, sh = vw / ratio;
  if (sh > vh) { sh = vh; sw = vh * ratio; }
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  ctx.translate(PHOTO_WIDTH, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, PHOTO_WIDTH, PHOTO_HEIGHT);

  const flash = $("flash");
  flash.classList.remove("on");
  void flash.offsetWidth;
  flash.classList.add("on");

  photoBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
  photoURL = URL.createObjectURL(photoBlob);
  $("shot").src = photoURL;
  $("shot").hidden = false;
  $("video").hidden = true;
  setCameraActions("taken");
}

function clearPhoto() {
  if (photoURL) URL.revokeObjectURL(photoURL);
  photoURL = null;
  photoBlob = null;
}

// ---------- 화면 3: 결과·공유 ----------

async function openResult() {
  if (!photoBlob) return;
  stopCamera();
  $("resultShot").src = photoURL;
  renderTrashLayer();
  renderBoothTop();
  show("result");

  // "다음"을 누르면 쓰레기가 깔린 사진을 이 기기의 컬렉션에 저장해요.
  const others = await loadGallery();
  try {
    framedBlob = await composeFramedPhoto();
    await savePhoto(framedBlob);
  } catch (error) {
    framedBlob = null;
  }
  renderGallery(others);
  prepareShareFile();
}

function trashAnchorY(top, height, t) {
  return top + height * (1 - t.bottom / 100);
}

/** 사진 하단에 쓰레기를 깐 4:3 사진을 만들어요. 컬렉션에 저장하고 공유 이미지에도 써요. */
async function composeFramedPhoto() {
  const [photo, ...trashImages] = await Promise.all([
    loadImage(photoURL),
    ...TRASH.map((t) => loadImage(`trash/${t.name}.svg`))
  ]);
  const canvas = document.createElement("canvas");
  canvas.width = PHOTO_WIDTH;
  canvas.height = PHOTO_HEIGHT;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(photo, 0, 0, PHOTO_WIDTH, PHOTO_HEIGHT);
  TRASH.forEach((t, i) => {
    const img = trashImages[i];
    const h = PHOTO_HEIGHT * t.h / 100;
    const w = h * (img.width / img.height);
    ctx.save();
    ctx.translate(PHOTO_WIDTH * t.x / 100, trashAnchorY(0, PHOTO_HEIGHT, t));
    ctx.rotate(t.r * Math.PI / 180);
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
  });
  return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("toBlob")), "image/jpeg", 0.9));
}

// ---------- 컬렉션 ----------

async function openCollection() {
  const grid = $("collectionGrid");
  grid.querySelectorAll("img").forEach((img) => URL.revokeObjectURL(img.src));
  show("collection");
  const photos = await loadGallery(Infinity);
  $("collectionTotal").textContent = `${photos.length.toLocaleString()}장`;
  grid.innerHTML = photos.length
    ? photos.map((p) => `<img src="${URL.createObjectURL(p.blob)}" alt="" loading="lazy" decoding="async">`).join("")
    : `<div class="empty">아직 찍은 사진이 없어요</div>`;
}

$("collectionBtn").addEventListener("click", openCollection);
$("collectionGrid").addEventListener("click", (event) => {
  if (event.target.tagName !== "IMG") return;
  $("viewerImg").src = event.target.src;
  $("viewer").hidden = false;
});
$("viewer").addEventListener("click", () => { $("viewer").hidden = true; });

function renderGallery(photos) {
  const thumbs = $("thumbs");
  thumbs.querySelectorAll("img").forEach((img) => URL.revokeObjectURL(img.src));
  thumbs.innerHTML = photos.length
    ? photos.map((p) => `<img src="${URL.createObjectURL(p.blob)}" alt="">`).join("")
    : `<div class="none">첫 번째 사진이에요!</div>`;
}

function renderTrashLayer() {
  $("trashLayer").innerHTML = TRASH.map((t) => `
    <img src="trash/${t.name}.svg" alt="" style="left:${t.x}%;bottom:${t.bottom}%;height:${t.h}%;transform:translateX(-50%) rotate(${t.r}deg)">`).join("");
}

// 공유 시트는 버튼을 누른 직후에만 열 수 있어요. 그래서 공유 이미지를 화면 3에 들어올 때 미리 만들어 둬요.
async function prepareShareFile() {
  shareFile = null;
  $("shareError").textContent = "";
  $("shareBtn").disabled = true;
  try {
    const blob = await composeShareImage();
    shareFile = new File([blob], `plobby-${Date.now()}.jpg`, { type: "image/jpeg" });
  } catch (error) {
    $("shareError").textContent = "공유 이미지를 만들지 못했어요. 웹사이트 주소(https)로 열어 주세요.";
  } finally {
    $("shareBtn").disabled = false;
  }
}

$("shareBtn").addEventListener("click", () => {
  if (!shareFile) return;
  $("shareError").textContent = "";

  if (navigator.canShare?.({ files: [shareFile] })) {
    navigator.share({ files: [shareFile] }).catch((error) => {
      // 공유 시트를 닫으면 AbortError가 나요. 그때는 따로 알리지 않아요.
      if (error.name !== "AbortError") $("shareError").textContent = "공유하지 못했어요. 다시 눌러 주세요.";
    });
  } else {
    // 파일 공유를 지원하지 않는 브라우저에서는 이미지를 내려받아요.
    const link = document.createElement("a");
    link.href = URL.createObjectURL(shareFile);
    link.download = shareFile.name;
    link.click();
  }
});

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** 화면 3과 같은 구성(상단 문구·날짜·로고, 사진, 사진 하단 쓰레기)으로 공유용 이미지를 만들어요. */
async function composeShareImage() {
  const W = 1600, P = 80;
  const photoW = W - P * 2, photoH = photoW * (PHOTO_HEIGHT / PHOTO_WIDTH);
  const photoX = P, photoY = 300;
  const H = Math.round(photoY + photoH + P);

  if (!framedBlob) throw new Error("framed photo missing");
  await document.fonts.ready;
  const framedURL = URL.createObjectURL(framedBlob);
  const [photo, logo] = await Promise.all([loadImage(framedURL), loadImage("logo.svg")]);
  URL.revokeObjectURL(framedURL);

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, H);

  // 좌측 상단: 문구, 현재/목표, 진행 바
  const collected = goal ? collectedCount(goal) : 0;
  const target = goal ? goal.target_count : 0;
  const pct = goal ? progressPercent(goal) : 0;
  ctx.textBaseline = "top";
  ctx.fillStyle = "#1C1F23";
  ctx.font = "800 60px Pretendard, sans-serif";
  ctx.fillText("우리가 만드는 푸른 바다", P, P);
  const current = collected.toLocaleString();
  ctx.fillStyle = "#0E7A4E";
  ctx.font = "700 44px Pretendard, sans-serif";
  ctx.fillText(current, P, P + 86);
  const currentW = ctx.measureText(current).width;
  ctx.fillStyle = "#6B7280";
  ctx.font = "500 44px Pretendard, sans-serif";
  ctx.fillText(`/${target.toLocaleString()}`, P + currentW + 4, P + 86);
  const barY = P + 156, barW = 640, barH = 22;
  ctx.fillStyle = "#E5E7EB";
  roundRect(ctx, P, barY, barW, barH, barH / 2);
  ctx.fill();
  if (pct > 0) {
    ctx.fillStyle = "#0E7A4E";
    roundRect(ctx, P, barY, Math.max(barH, barW * pct / 100), barH, barH / 2);
    ctx.fill();
  }

  // 우측 상단: 날짜, 로고
  ctx.textAlign = "right";
  ctx.fillStyle = "#6B7280";
  ctx.font = "600 40px Pretendard, sans-serif";
  ctx.fillText(todayText(), W - P, P + 8);
  ctx.textAlign = "left";
  const logoH = 72, logoW = logoH * (73 / 23);
  ctx.drawImage(logo, W - P - logoW, P + 72, logoW, logoH);

  // 쓰레기가 깔린 사진
  ctx.save();
  roundRect(ctx, photoX, photoY, photoW, photoH, 48);
  ctx.clip();
  ctx.drawImage(photo, photoX, photoY, photoW, photoH);
  ctx.restore();

  return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("toBlob")), "image/jpeg", 0.92));
}

// ---------- 촬영 기기에 사진 모아두기 (IndexedDB) ----------

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("plobby-booth", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function savePhoto(blob) {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").add({ blob, createdAt: Date.now() });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (error) {
    // 저장하지 못해도 촬영·공유는 그대로 할 수 있어요.
  }
}

async function loadGallery(limit = GALLERY_LIMIT) {
  try {
    const db = await openDB();
    const all = await new Promise((resolve, reject) => {
      const request = db.transaction("photos").objectStore("photos").getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return all.sort((a, b) => b.createdAt - a.createdAt).slice(0, limit);
  } catch (error) {
    return [];
  }
}

refresh();
setInterval(refresh, POLL_MS);
</script>
